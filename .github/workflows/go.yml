name: Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -vE '(^internal/infra/(graph/generated.go|graph/model/models_gen.go|grpc/pb/))'))"
      - name: Test with race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build all packages
        run: go build ./...
